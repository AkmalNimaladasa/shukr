  /* Critical fallback so nothing renders huge before CSS loads */
  svg { width: 20px; height: 20px; }
  #boot { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #FFF7F1; color: #4D4458; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; z-index: 999; }

  #boot button { font: inherit; padding: 10px 18px; border-radius: 12px; border: 1px solid #E3164E; background: #E3164E; color: #fff; }
  #boot pre { max-width: 92vw; white-space: pre-wrap; font-size: 12px; text-align: left; opacity: .8; }

<script>
  (function () { try { var s = JSON.parse(localStorage.getItem('shukr.theme') || '"auto"'); var pl = JSON.parse(localStorage.getItem('shukr.palette') || '"cream"'); document.documentElement.setAttribute('data-palette', pl); var d = s === 'dark' || (s === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light'); } catch (e) {} })();
  // ---- Boot guard + diagnostics (plain ES5 so it runs on every phone) ----
  window.__bootErrors = [];
  window.shukrBeacon = function (kind, extra) {
    try {
      var body = JSON.stringify({ kind: kind, url: location.href, standalone: !!(window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)), sw: !!(navigator.serviceWorker && navigator.serviceWorker.controller), w: window.innerWidth, h: window.innerHeight, errors: window.__bootErrors.slice(0, 5), extra: extra || null });
      if (navigator.sendBeacon) navigator.sendBeacon('/api/client-log', body); else { var x = new XMLHttpRequest(); x.open('POST', '/api/client-log'); x.send(body); }
    } catch (e) {}
  };
  window.addEventListener('error', function (e) {
    var m = (e && e.message) || (e && e.target && (e.target.src || e.target.href) ? 'Failed to load ' + (e.target.src || e.target.href) : 'Script error');
    window.__bootErrors.push(m + (e && e.filename ? ' @' + e.filename.split('/').pop() + ':' + e.lineno + ':' + e.colno : ''));
    if (window.__bootErrors.length <= 3) window.shukrBeacon('error');
  }, true);
  window.addEventListener('unhandledrejection', function (e) { var r = e && e.reason; var rm = String(r && (r.message || r)); if (/Unable to load image data:/.test(rm)) return; window.__bootErrors.push('Promise: ' + rm.slice(0, 200)); if (window.__bootErrors.length <= 3) window.shukrBeacon('rejection'); });
  window.shukrRepair = function () {
    try { localStorage.removeItem('shukr.theme'); localStorage.removeItem('shukr.palette'); } catch (e) {}
    var done = function () { location.replace('/?r=' + Date.now()); };
    try {
      var ps = [];
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) ps.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
      if (window.caches && caches.keys) ps.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches['delete'](k); })); }));
      Promise.all(ps).then(done, done); setTimeout(done, 2500);
    } catch (e) { done(); }
  };
  setTimeout(function () {
    if (window.__shukrStarted) return;
    window.shukrBeacon('boot-timeout');
    var b = document.getElementById('boot'); if (!b) return;
    b.style.display = 'flex';
    b.innerHTML = '<div style="font-size:18px"><b>Shukr didn\u2019t start</b></div><div>Tap below to clear the old version and reload.</div><button id="bootRepair">Repair &amp; reload</button>' + (window.__bootErrors.length ? '<pre>' + window.__bootErrors.slice(0, 4).join('\n').replace(/</g, '&lt;') + '</pre>' : '<pre>No error reported \u2014 the app script may not have loaded.</pre>');
    var rb = document.getElementById('bootRepair'); if (rb) rb.addEventListener('click', function () { shukrRepair(); });
  }, 6000);
</script>
